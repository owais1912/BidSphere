# ==================================================
# BidSphere Backend Configuration
# Copy this file to application.properties and fill in your values
# NEVER commit application.properties with real credentials
# ==================================================

# Server
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bidsphere?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# Generate a secure base64-encoded 256-bit key for production
# You can generate one with: openssl rand -base64 64
app.jwt.secret=YOUR_BASE64_ENCODED_JWT_SECRET_HERE
app.jwt.expiration-ms=86400000

# CORS - Frontend origin
app.cors.allowed-origins=http://localhost:5173

# Logging
logging.level.com.bidsphere=INFO
logging.level.org.springframework.security=WARN
